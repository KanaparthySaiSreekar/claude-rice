# Rio, the optional "pixel" terminal. Windows Terminal stays the daily driver.
# Colours generated from the "Claude Aurora" palette so both terminals match.

# Claude Code only sends real pictures to terminals it recognises by name, and Rio is not one yet.
# Forced on HERE ONLY: in a terminal without kitty-graphics support this prints stray characters.
env-vars = ["CLAUDE_CODE_FORCE_TERMINAL_IMAGES=1"]

[shell]
program = "C:\\Users\\Kasasree\\AppData\\Local\\Microsoft\\WindowsApps\\pwsh.exe"
args = []

[fonts]
size = 14
family = "JetBrainsMono NFM"

[colors]
background = "#0C0A18"
foreground = "#ECE8FA"
cursor = "#FF8F66"
selection-background = "#3B3478"
selection-foreground = "#ECE8FA"
black = "#1A1633"
red = "#FF6B88"
green = "#62EBB0"
yellow = "#FFC857"
blue = "#5BA8FF"
magenta = "#A78BFA"
cyan = "#4DE3D8"
white = "#D8D3F0"
light-black = "#7A74AD"
light-red = "#FF93A8"
light-green = "#9AF5CC"
light-yellow = "#FFDC8A"
light-blue = "#8FC4FF"
light-magenta = "#C3B1FF"
light-cyan = "#8EF0E8"
light-white = "#FFFFFF"
