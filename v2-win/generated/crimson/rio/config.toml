# Rio, the optional "pixel" terminal. Windows Terminal stays the daily driver.
# Colours generated from the "Claude Crimson" palette so both terminals match.

# Claude Code only sends real pictures to terminals it recognises by name, and Rio is not one yet.
# Forced on HERE ONLY: in a terminal without kitty-graphics support this prints stray characters.
env-vars = ["CLAUDE_CODE_FORCE_TERMINAL_IMAGES=1"]

[shell]
program = "C:\\Users\\Kasasree\\AppData\\Local\\Microsoft\\WindowsApps\\pwsh.exe"
args = []

[fonts]
size = 14
family = "JetBrainsMono NFM"

[colors]
background = "#0A0808"
foreground = "#F6EEEE"
cursor = "#FF4040"
selection-background = "#4D2323"
selection-foreground = "#F6EEEE"
black = "#1C1818"
red = "#FF5C5C"
green = "#86D99C"
yellow = "#FFB347"
blue = "#A9B9D6"
magenta = "#CBA9D6"
cyan = "#8FCFC8"
white = "#DAD0D0"
light-black = "#8C7E7E"
light-red = "#FF8D8D"
light-green = "#B2EBC0"
light-yellow = "#FFD08A"
light-blue = "#C8D4E8"
light-magenta = "#E2CBEA"
light-cyan = "#B8E4DF"
light-white = "#FFFFFF"
