# Rio — the "pixel" terminal. Windows Terminal stays the daily driver.
# Palette copied from the Windows Terminal "Claude" scheme so both terminals match.

# Claude Code only sends real pictures to terminals it recognises by name, and Rio is not one yet.
# Forced on HERE ONLY: in a terminal without kitty-graphics support this prints stray characters.
env-vars = ["CLAUDE_CODE_FORCE_TERMINAL_IMAGES=1"]

[shell]
program = "C:\\Users\\Kasasree\\AppData\\Local\\Microsoft\\WindowsApps\\pwsh.exe"
args = []

[fonts]
size = 14
family = "JetBrainsMono NFM"

[colors]
background = "#2B2A27"
foreground = "#F5E6D3"
cursor = "#D97757"
selection-background = "#45413A"
selection-foreground = "#F5E6D3"
black = "#211F1D"
red = "#F28482"
green = "#A3B18A"
yellow = "#FFD166"
blue = "#8AA9C9"
magenta = "#B48EAD"
cyan = "#94C5CC"
white = "#E6D9C4"
light-black = "#6B655C"
light-red = "#FF9B94"
light-green = "#BEC9A0"
light-yellow = "#FFE0A0"
light-blue = "#A9C3DC"
light-magenta = "#CBA0D8"
light-cyan = "#B0D6DC"
light-white = "#FAF9F5"
